name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deploy at a time; let an in-flight run finish rather than cancelling
# it, so a half-uploaded artifact is never published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build HTML bundle
        # Project Pages serve from /<repo>/, so the bundle needs its subpath
        # baked in or every asset and link 404s.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/html
        run: pnpm build:html

      - name: Assemble site
        run: |
          mkdir -p _site/fonts
          cp demo/index.html _site/
          cp apps/html/public/favicon.svg _site/
          cp apps/html/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2 _site/fonts/
          cp -r apps/html/dist _site/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
