name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Supersede in-flight PR runs, but never cancel a run on main — that one may be
# mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Root-relative build: what a consumer gets when they drop dist/ into
      # their own app. Also what the smoke tests run against.
      - name: Build
        run: pnpm build:html

      # Tailwind drops a class naming a missing token without a word, so the
      # compiled CSS is the only place the drift is visible.
      - name: Token guard
        run: pnpm guard:tokens

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests
        run: pnpm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Rebuild under the Pages subpath and prove the prefix actually landed.
      # A base-path regression is silent locally and breaks every asset in prod.
      - name: Build for Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/html
        run: pnpm build:html

      - name: Verify base path applied
        run: |
          prefix="/${{ github.event.repository.name }}/html"
          index=apps/html/dist/index.html
          grep -q "href=\"$prefix/_astro/" "$index" \
            || { echo "::error::stylesheet is missing the $prefix prefix"; exit 1; }
          grep -q "href=\"$prefix/favicon.svg\"" "$index" \
            || { echo "::error::favicon is missing the $prefix prefix"; exit 1; }
          unprefixed=$(grep -o 'href="/[^"]*"' "$index" | grep -v "href=\"$prefix" || true)
          if [ -n "$unprefixed" ]; then
            echo "::error::these links will 404 under the Pages subpath:"
            echo "$unprefixed"
            exit 1
          fi
          echo "base path applied to all links and assets"

      - name: Build React for Pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/react
        run: pnpm build:react

      - name: Assemble site
        run: |
          mkdir -p _site/fonts
          cp demo/index.html _site/
          cp apps/html/public/favicon.svg _site/
          cp apps/html/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2 _site/fonts/
          cp -r apps/html/dist _site/html
          cp -r apps/react/dist _site/react

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    name: Deploy demo
    # Only after everything above is green, and only on main.
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
